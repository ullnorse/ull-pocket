<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Understand ull-pocket</title>

<style>
:root{--fg:var(--foreground,#1c1f26);--mut:var(--muted-foreground,#5d6470);--line:var(--border,#d9d7cf);--card:var(--card-bg,transparent);--acc:var(--primary,#1f4fc0);--acc-fg:var(--primary-foreground,#fff);--cu:#b4692b;--ok:var(--success,#1d7f4e);--bad:var(--destructive,#c23a2c);--warn:var(--warning,#a86a00);--code:var(--code-background,rgba(127,127,127,.13));--sans:var(--font-sans,system-ui,-apple-system,"Segoe UI",sans-serif);--mono:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);--r:var(--radius,8px);--pop:var(--popover,#fff)}
html.standalone{background:#fbfaf6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pop:var(--popover,#1d2129);--fg:var(--foreground,#e7e9ee);--mut:var(--muted-foreground,#a0a7b4);--line:var(--border,#343944);--acc:var(--primary,#86a8ff);--acc-fg:var(--primary-foreground,#10141f);--ok:var(--success,#4cc38a);--bad:var(--destructive,#ff7a6b);--warn:var(--warning,#e0a63a);--cu:#d99255}html.standalone:not([data-theme="light"]){background:#14171d}}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:16px/1.6 var(--sans)}
#app{display:grid;grid-template-columns:1fr;max-width:1160px;margin:0 auto;padding:12px 16px}
@media(min-width:1000px){#app{grid-template-columns:250px minmax(0,1fr);gap:40px;padding:24px}nav{position:sticky;top:16px;align-self:start}}
nav .lst{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
nav button{font:inherit;font-size:14px;color:var(--fg);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;min-width:34px}
nav button .t{display:none}
nav button.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
nav button.done:not(.on){border-color:var(--ok);color:var(--ok)}
@media(min-width:1000px){nav .lst{display:block}nav button{display:block;width:100%;text-align:left;border:0;padding:4px 8px;line-height:1.3;margin-bottom:1px}nav button .t{display:inline}nav button .n{color:var(--mut);font-variant-numeric:tabular-nums;margin-right:6px}nav button.on .n{color:inherit}nav button.done:not(.on)::after{content:" ✓"}}
.brand{font-weight:700}.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0}
.prog{font-size:13px;color:var(--mut);margin-top:4px}
main{min-width:0}
h1{font-size:28px;line-height:1.2;margin:16px 0 4px}h2{font-size:20px;margin:30px 0 6px}h3{font-size:16px;margin:20px 0 4px}
.goal{color:var(--mut);margin:0 0 16px}
p{margin:8px 0}ul,ol{padding-left:22px;margin:8px 0}li{margin:3px 0}
code,.m{font-family:var(--mono);font-size:.88em}code{background:var(--code);padding:1px 4px;border-radius:4px}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}th,td{border-bottom:1px solid var(--line);text-align:left;padding:6px 10px 6px 0;vertical-align:top}th{font-weight:600;color:var(--mut)}
.p{font-family:var(--mono);font-size:.86em;font-weight:600;color:var(--cu);background:none;border:0;border-bottom:1px dotted var(--cu);padding:0;cursor:pointer}
.box{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:16px 0}
.box>h3:first-child{margin-top:0}
.note{border-left:3px solid var(--acc);padding:2px 0 2px 12px;margin:14px 0}
.warn{border-left-color:var(--bad)}
.est{font-size:12px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 4px;white-space:nowrap}
.q{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:12px 0}.q b{display:block;margin-bottom:6px;font-weight:600}
.q button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--fg);background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:5px 0;cursor:pointer}
.q button.y{border-color:var(--ok);color:var(--ok);font-weight:600}.q button.n{border-color:var(--bad);color:var(--bad)}
.why{margin-top:8px;font-size:15px}
label{display:block;font-size:14px;margin:8px 0 2px}input[type=range]{width:100%;accent-color:var(--acc)}
select,textarea,input[type=text],input[type=search]{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
select option{color:#111;background:#fff}
textarea{width:100%;min-height:110px;line-height:1.45}
.btn{font:inherit;font-size:14px;color:var(--fg);background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;margin:2px 4px 2px 0}.btn.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.out{font-family:var(--mono);font-size:14px;margin-top:10px;line-height:1.55}
.okt{color:var(--ok)}.badt{color:var(--bad)}.wrnt{color:var(--warn)}.mt{color:var(--mut)}
.pn{display:flex;justify-content:space-between;gap:8px;margin:24px 0 20px}.pn .btn{padding:8px 14px}
svg text{fill:var(--fg);font-family:var(--sans)}svg{display:block;max-width:100%;height:auto}
.wire{fill:none;stroke:var(--line);stroke-width:2.5}.wire.live{stroke:var(--acc);stroke-width:3.5;stroke-dasharray:7 6;animation:fl .7s linear infinite}.wire.hot{stroke:var(--bad);stroke-width:3.5;stroke-dasharray:7 6;animation:fl .7s linear infinite}
.wire.back{animation-direction:reverse}
@keyframes fl{to{stroke-dashoffset:-13}}@media(prefers-reduced-motion:reduce){.wire.live,.wire.hot{animation:none}}
.nd{fill:none;stroke:var(--mut);stroke-width:1.3}.nd.on{stroke:var(--acc);stroke-width:2}
.mini{max-width:230px;float:right;margin:0 0 8px 16px}@media(max-width:560px){.mini{float:none;margin:8px 0}}
.fp{fill:var(--line);opacity:.55;cursor:pointer}.fp.hl{fill:var(--cu);opacity:1}.fp:hover{opacity:1}
.clr{clear:both}
.dgw{overflow-x:auto}.dgw>svg{min-width:560px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.g{font:inherit;color:inherit;background:none;border:0;border-bottom:1px dotted var(--mut);padding:0;cursor:help}
#pop{z-index:30!important;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(440px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--pop);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:10}
#pop .x{float:right;font:inherit;background:none;border:0;color:var(--mut);cursor:pointer;font-size:20px;line-height:1;padding:0 4px}
#pop svg{max-width:150px;margin:8px 0}
#jump{width:100%;margin:8px 0}
@media(min-width:1000px){#jump{display:none}}@media(max-width:999.9px){nav .lst{display:none}}
details{margin-top:8px}summary{cursor:pointer;color:var(--acc);font-size:15px}
.ans{font-size:15px;margin-top:6px}
.rst{font:inherit;font-size:12px;color:var(--mut);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;margin-top:6px}
input[type=text]{width:100%;min-width:64px}
.next.on{font-weight:600}.small{font-size:14px}

.schw{margin:12px 0}.schw figcaption{color:var(--mut);margin-top:4px}
.schf{display:block;position:relative;overflow:hidden;width:100%;padding:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);cursor:zoom-in}
.schf i{position:absolute;display:block;aspect-ratio:420/297}
#sv{position:fixed;inset:0;height:100dvh;z-index:20;background:var(--pop);flex-direction:column}
#svs{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;background:#fff}
#svp{position:relative}
#svr{position:absolute;width:3.5%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #e0301e;border-radius:50%;pointer-events:none}
#sv .tb{border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
#svl{height:48px;overflow:hidden;display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
#sv .row{display:flex;gap:8px}#sv .row select{flex:1;min-width:0;font:inherit;font-size:16px;min-height:44px;padding:0 6px}#sv .row .btn{min-width:48px;min-height:44px;margin:0}
.pins{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.pins td{padding:6px 6px 6px 0;border-top:1px solid var(--line);vertical-align:top}.pins button.n{font:inherit;color:var(--acc);background:none;border:0;padding:4px 0;text-decoration:underline dotted;cursor:pointer;text-align:left;word-break:break-word}

<template id="l0" data-t="Start here" data-p="">
<p class="goal">This course takes you from "what is voltage?" to explaining every part on your board.</p>
<p>Your embedded background helps: you already think in GPIOs, buses, registers and active-low signals. The missing layer is what happens underneath: why a line sits at 3.3 V, where current goes, and why each resistor has its value.</p>

<h2>How to use this</h2>
<ol><li><b>Do the lessons in order.</b> Lessons 1–3 give you the vocabulary, and each later lesson relies on them.</li>
<li><b>Predict before you touch a widget.</b> A wrong prediction teaches you more than a right one.</li>
<li><b>Answer the checks.</b> A lesson gets its tick when every question is right. A wrong guess costs nothing.</li>
<li><b>Write the teach-back.</b> Each lesson ends by asking you to explain something in your own words. This is the real test, so don't skip it. Your notes save in this browser, so copy them out from the final lesson now and then.</li>
<li><b>Everything is on this page.</b> Lessons show their part of your real schematic: tap it to zoom. Tap an orange part name like <button class="p" data-ref="U6">U6</button> to see what it does, where it sits and what each pin connects to. Dotted words like <button class="g" data-term="Rail">rail</button> have a definition.</li></ol>
<div class="note"><b>How far to trust this page.</b> The connections and part values come from your netlist, and most numbers come from your datasheet PDFs. Values tagged <span class="est">est.</span> are my estimates, not measurements. This page can also be wrong, so before you change the design, check the PDF in <code>datasheets/</code>. Nothing here proves the board works. Only a real board can, which is the last lesson.</div>
<h2>What "understood" means</h2>
<p>For any part you should be able to say what it does, work out its value, predict what breaks if it's removed or doubled, and name the datasheet limit behind it. The final exam tests that with fault-finding scenarios.</p>

<template id="l1" data-t="Voltage, current, power" data-p="">
<p class="goal">Three ideas explain most of this board.</p>
<h2>Voltage is a difference</h2>
<p>Voltage is like height: it only means something between two points. "IO2 is at 3.3 V" really means 3.3 V above GND, the shared reference point. A logic HIGH is just a net sitting near the top of the supply.</p>
<h2>Current flows in loops</h2>
<p>Current is how much charge moves per second, in amps. Everything that flows out of a supply has to come back to it, so <b>every wire has a return path, usually through ground</b>. This one idea explains reverse-protection FETs, ground planes and why layout matters.</p>
<h2>Resistance links them</h2>
<p>Ohm's law: <b>V = I × R</b>. Rearrange it to fit the question. These two also come up constantly:</p>
<ul><li><b>P = V × I</b>: power, in watts. In a resistor or regulator, this becomes heat. Double the current through a fixed resistor and its voltage doubles too, so its heat goes up ×4.</li>
<li><b>Battery capacity</b>: mAh is current × time. 1200 mAh at 270 mA is about 4.4 h, ignoring the slow end of charging.</li></ul>
<div class="box"><h3>Try it: size an LED resistor</h3>
<p class="small">An LED has a nearly fixed voltage across it (<button class="g" data-term="Vf">Vf</button>), and the resistor takes up the rest. Then I = (Vsupply − Vf) / R. Before pressing a preset, try working it out on paper.</p>
<div id="w-led"></div></div>
<h2>Why Vf barely moves</h2>
<p>A diode isn't a resistor. Here's the voltage each needs as current rises, for a 600 Ω resistor and a typical silicon diode (idealised: about 60 mV more gives 10× the current):</p>
<table><tr><th>Current</th><th>Resistor</th><th>Diode</th></tr><tr><td>0.1 mA</td><td>0.06 V</td><td>0.54 V</td></tr><tr><td>1 mA</td><td>0.6 V</td><td>0.60 V</td></tr><tr><td>10 mA</td><td>6 V</td><td>0.66 V</td></tr><tr><td>100 mA</td><td>60 V</td><td>0.72 V</td></tr></table>
<p>So the rest of the circuit sets the current, and the diode just takes its roughly fixed voltage. From 5 V through 1 kΩ, a diode settles near 0.64 V and 4.4 mA. At 10 V the current about doubles, the diode gains only about 20 mV, and the resistor takes the rest. With nothing to limit the current, a small excess voltage means a huge current, which is why an LED needs a resistor.</p>
<div id="q1"></div>
<div data-tb="Explain to a friend why you can't connect an LED straight between 3.3 V and GND, using the words voltage, current and resistor."></div>
</template>

<template id="l2" data-t="The parts vocabulary" data-p="">
<p class="goal">Your board uses only a handful of part types. Here is what each one does in practice.</p>
<div class="tw"><table><tr><th>Part</th><th>Behaviour</th><th>Why you use it</th></tr>
<tr><td><b>Resistor</b> R</td><td>V = I × R</td><td>Limit current, set a default level (pull-up), or tell a chip a setting</td></tr>
<tr><td><b>Capacitor</b> C</td><td>Stores charge, resists sudden voltage changes</td><td>A tiny local energy reserve beside chips; with a resistor, a delay</td></tr>
<tr><td><b>Inductor</b> L</td><td>Stores energy in a magnetic field, resists sudden current changes</td><td>Makes a higher voltage in the display's boost circuit</td></tr>
<tr><td><b>Diode</b> D</td><td>One-way valve, with a voltage drop</td><td>Steering current; an LED is a diode that emits light</td></tr>
<tr><td><b>MOSFET</b> Q</td><td>Voltage-controlled switch: gate-to-source voltage turns it on</td><td>The GPIO of power electronics. Q1 switches the boost, and Q2 blocks a reversed battery</td></tr>
<tr><td><b>Regulator</b> U7</td><td>Holds a fixed output</td><td>Turns a varying supply into a steady one</td></tr></table></div>
<p><b>MOSFET terminals:</b> gate, source and drain. On an N-channel FET, a gate voltage above the source lets current pass between drain and source. Inside is also a <b>body diode</b> that conducts from source to drain even when the FET is off.</p>
<h2>Five patterns you'll see everywhere</h2>
<h3>1. Decoupling capacitor</h3>
<p>A chip's current comes in sharp bursts, and long traces can't deliver it quickly. A small cap beside the power pin supplies each burst locally. It's like a small cache in front of slow memory. That's why almost every chip here has a 100 nF cap next to it.</p>
<h3>2. Pull-up resistor and open-drain outputs</h3>
<p>An open-drain output can only pull low or let go. When it lets go, a pull-up resistor brings the line high. You know this from I2C. This board also uses it for <button class="p" data-ref="U6">U6</button>'s PGOOD and <button class="p" data-ref="U5">U5</button>'s ALRT. The cost: while the line is held low, current flows through the resistor, I = V / R.</p>
<h3>3. Voltage divider</h3>
<p>Two resistors in series split a voltage: Vout = Vin × R2 / (R1 + R2). <button class="p" data-ref="R4">R4</button> and <button class="p" data-ref="R5">R5</button> use this to make a logic level from USB 5 V.</p>
<h3>4. RC delay</h3>
<p>A resistor charging a capacitor takes time. <b>τ = R × C</b> is the time to cover 63% of the change, and 5τ is effectively done. In this design it delays reset and cleans up buttons.</p>
<h3>5. Programming resistor</h3>
<p>Some chips read a setting from a resistor, like a config register you solder. <button class="p" data-ref="R9">R9</button> sets the charge current this way.</p>
<div class="note"><b>Capacitors shrink under voltage.</b> Small ceramic caps can lose much of their rated capacitance as DC voltage rises. That's why the LDO is specified for 1 µF <i>effective</i> capacitance, and why <button class="p" data-ref="C7">C7</button> is 10 µF.</div>
<div id="q2"></div>
<div data-tb="Using your embedded experience, explain what a pull-up does and why a stronger (smaller) one costs more battery but gives faster edges."></div>
</template>

<template id="l3" data-t="Reading schematics, datasheets" data-p="">
<p class="goal">Learn to read the two documents this whole board comes from.</p>
<h2>The schematic</h2>
<ul><li><b>Reference (R9, U6)</b>: the name of one physical part. R is resistor, C capacitor, U chip, J connector, Q transistor, D diode, L inductor, SW switch, TP test point.</li>
<li><b>Net</b>: a set of connected pins. Two pins with the same label, such as <code>VSYS</code>, are wired together even with no line drawn. Think of a global variable.</li>
<li><b>Power symbols</b>: <code>+3V3</code> and <code>GND</code> are also nets, drawn as symbols.</li>
<li><b>_N suffix</b>: active low, as in <code>USB_PGOOD_N</code>.</li>
<li><b>DNP</b>: do not populate. The footprint exists but no part is fitted (<button class="p" data-ref="C1">C1</button>, <button class="p" data-ref="R8">R8</button>).</li>
<li><b>0 Ω resistor</b>: a removable wire (<button class="p" data-ref="R13">R13</button>, <button class="p" data-ref="R3">R3</button>).</li></ul>
<p><b>Try it:</b> tap <button class="g" data-net="VSYS">VSYS</button> to list every pin it reaches, then tap a part to follow it onward.</p>
<h2>The datasheet</h2>
<p>Don't read it front to back. Go in this order:</p>
<ol><li><b>First page</b>: what is it, and what are the headline numbers?</li>
<li><b>Application circuit</b>: the vendor's working example. Much of your schematic started there.</li>
<li><b>Pin table</b>: what each pin wants, including warnings like "do not leave unconnected".</li>
<li><b>Electrical characteristics</b>: the min, typ and max values.</li>
<li><b>Absolute maximum ratings</b>: the limits beyond which damage can occur. These are not operating conditions.</li></ol>
<h2>Why min and max matter</h2>
<p>Typical is what you usually get, while min and max are what you must design for. For example, the charger datasheet gives a factor K<sub>ISET</sub> of 797 / 890 / 975 A·Ω (min / typ / max). With <button class="p" data-ref="R9">R9</button> = 3.3 kΩ:</p>
<div class="out">ICHG = KISET / RISET<br>min 797/3300 = 241 mA · typ 890/3300 = 270 mA · max 975/3300 = 295 mA</div>
<p>So "270 mA" really means somewhere from 241 to 295 mA, before you count the resistor's own 1% tolerance.</p>
<div class="box"><h3>Exercise: read a real excerpt</h3><p>Two rows from the BQ24073 datasheet:</p><div class="out"><b>Pin Functions, ILIM (pin 12, input)</b><br>"Adjustable Current Limit Programming Input. Connect a 1100-Ω to 8-kΩ resistor from ILIM to VSS to program the maximum input current (EN2=1, EN1=0). The input current includes the system load and the battery charge current. Leaving ILIM unconnected disables all charging."<br><br><b>Electrical characteristics, VO(REG)</b><br>OUT pin voltage regulation (BQ24073, BQ24074), VIN &gt; VOUT + VDO(IN-OUT): min 4.3, typ 4.4, max 4.5 V</div><p>What happens if ILIM is left unconnected? What voltage does OUT hold, and how far can it vary? You'll use VO(REG) in lesson 4 and the ILIM answer in lesson 6.</p><details><summary>Show the answers</summary><p class="ans">Leaving ILIM unconnected disables all charging. OUT regulates to 4.4 V typical, anywhere from 4.3 to 4.5 V.</p></details></div>
<div id="q3"></div>
<div data-tb="Describe in your own steps how you would check whether a resistor on this board has the right value, starting from its reference."></div>
</template>

<template id="l4" data-t="Power: the big picture" data-p="J1 U6 Q2 U7 R13 J2">
<p class="goal">Where does current flow in every situation? Most faults start here.</p>
<p>The ESP32 needs a steady 3.0–3.6 V. USB gives about 5 V, and the battery drifts from 4.2 V down to about 3 V. Two chips bridge the gap:</p>
<ul><li><button class="p" data-ref="U6">U6</button> is a <b>power-path charger</b>. It feeds <code>VSYS</code>, the board's main <button class="g" data-term="Rail">rail</button>, from USB when available and from the battery otherwise. It also charges the battery.</li>
<li><button class="p" data-ref="U7">U7</button> is an <b><button class="g" data-term="LDO">LDO</button></b>. It turns whatever <code>VSYS</code> is into 3.3 V, the <code>+3V3</code> rail.</li></ul>
<div class="clr"></div>
<div class="box"><h3>Try it: power simulator</h3><p class="small">Predict each result first. (1) USB off, battery 3.0 V: compare Awake with Deep sleep. (2) USB off, Wi-Fi burst at 3.4 V. (3) USB on, Wi-Fi burst: what happens to charging?</p><div id="w-pow"></div></div>
<h2>The four rails</h2>
<div class="tw"><table><tr><th>Net</th><th>Voltage</th><th>Fed by</th><th>Test point</th></tr>
<tr><td><code>VBUS</code></td><td>about 5 V, 0 V unplugged</td><td>USB</td><td><button class="p" data-ref="TP1">TP1</button></td></tr>
<tr><td><code>VBAT</code></td><td>about 3.0–4.2 V</td><td>The cell</td><td><button class="p" data-ref="TP4">TP4</button></td></tr>
<tr><td><code>VSYS</code></td><td>about 4.4 V on USB, just under VBAT on battery</td><td>U6</td><td><button class="p" data-ref="TP2">TP2</button></td></tr>
<tr><td><code>+3V3</code></td><td>3.3 V until the battery gets low</td><td>U7, through R13</td><td><button class="p" data-ref="TP5">TP5</button></td></tr></table></div>
<h2>Why not simply charge from USB and run from the battery?</h2>
<p>Without a power path, the load and the battery share one node. The charger then can't tell how much current goes into the cell, so it can't end the charge properly, and a dead battery could stop the board from booting. U6 keeps the two separate.</p>
<h2>Why the 4.4 V rail?</h2>
<p>This is the difference between this chip's variants: the BQ24073 regulates OUT to a fixed 4.4 V, while the BQ24072 tracks the battery at about VBAT + 225 mV. A fixed 4.4 V means <code>VSYS</code> stays well above 3.3 V on USB even with a nearly flat cell, and it stays below U7's 5.5 V input limit.</p>
<h2>What you just saw in the simulator</h2>
<ul><li><b>At the low end,</b> an LDO can't make its output higher than its input. Below 3.3 V plus the dropout, <code>+3V3</code> simply follows the battery down. At 3.0 V you're at the ESP32's minimum.</li>
<li><b>A Wi-Fi burst</b> pulls a large current, so the LDO's <button class="g" data-term="Dropout">dropout</button> grows and the cell's own voltage sags under load. The simulator models only the dropout. That's why firmware should block Wi-Fi below about 3.55 V: it keeps a margin for both.</li>
<li><b>With USB in,</b> U6 limits input to 500 mA and <b>the load gets priority</b>. If the system takes more, charging slows down. TI calls this <button class="g" data-term="DPPM">DPPM</button>.</li></ul>
<div id="q4"></div>
<div data-tb="Without looking, trace the current from the USB connector to the ESP32 with USB in. Then explain what changes when you unplug it, and how firmware finds out."></div>
</template>

<template id="l5" data-t="USB-C input" data-p="J1 R1 R2 R3 C1 U8 C2 D5 R21 TP1">
<p class="goal">One connector does three jobs: power, data and protection.</p>
<h3><button class="p" data-ref="J1">J1</button>: the socket</h3>
<p>USB-C can be plugged in either way up, so many pins come in A and B pairs. Your schematic joins them: A6 and B6 are both D+, A7 and B7 both D−. The SBU pins aren't used.</p>
<h3><button class="p" data-ref="R1">R1</button>, <button class="p" data-ref="R2">R2</button>: 5.1 kΩ on CC1, CC2</h3>
<p>CC stands for Configuration Channel. These pull-downs tell a USB-C source "a device that wants power is here". A proper USB-C charger won't apply 5 V without seeing them. Each CC pin needs its own resistor. Skip them and a C-to-C cable can leave the board dead, even though an old A-to-C cable works. That's a famous beginner's mistake.</p>
<h3><button class="p" data-ref="U8">U8</button>: ESD protection</h3>
<p>Touching a USB connector can inject a kilovolt-scale spike. U8 contains fast diodes that steer D+ and D− spikes into VBUS or GND before they reach the ESP32. It only works if it's physically close to the connector, and it is.</p>
<div class="note"><b>Why pin 5 is on +3V3.</b> U8 has a diode from each data line up to pin 5, shown below. With pin 5 on VBUS, the ESP32's D+ pull-up would leak through the top diode on battery and lift unplugged VBUS to about 2.7 V. On +3V3 the diodes conduct only above about 3.9 V, and D+ and D− stay below 3.6 V.</div>
<figure class="schw"><svg viewBox="0 0 320 150" role="img" aria-label="U8 internal diodes" style="max-width:360px;width:100%;display:block" fill="currentColor" font-size="12"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M60 22H260M60 128H260M100 22V128M160 22V128M220 22V128"/><path d="M90 42H110M210 42H230M90 90H110M210 90H230M150 66H170"/><path d="M100 22V42" style="stroke:var(--acc)"/></g><path d="M100 42L91 58H109Z" style="fill:var(--acc)"/><path d="M220 42L211 58H229ZM100 90L91 106H109ZM220 90L211 106H229ZM160 66L151 82H169Z"/><circle cx="100" cy="74" r="3"/><circle cx="220" cy="74" r="3"/><text x="60" y="15">+3V3, pin 5</text><text x="60" y="144">GND, pin 2</text><text x="4" y="78">D+, pins 1, 6</text><text x="228" y="78">D−, pins 3, 4</text></svg><figcaption class="small">Inside U8 (redrawn from its datasheet). The blue diode would leak D+ into VBUS if pin 5 were on VBUS. The middle one clamps pin 5 to GND.</figcaption></figure><h3>D+ and D−</h3>
<p>They go straight to IO13 and IO12, the ESP32's built-in USB, which is why you need no separate USB-serial chip. It's a differential pair: the receiver reads the difference, so noise on both cancels out. Layout targets about 90 Ω; this board comes to about 86 Ω by calculation. Espressif's schematic checklist recommends reserving 22–33 Ω series resistors and unpopulated capacitors to ground, close to the chip. This board has neither. I'd rate that low risk on such a short run <span class="est">est.</span>, but it's worth knowing.</p>
<h3><button class="p" data-ref="R3">R3</button>, <button class="p" data-ref="C1">C1</button>: shield</h3>
<p>The connector's metal shell connects to ground through the 0 Ω R3. C1 is unfitted and exists only as an option for a metal case.</p>
<h3><button class="p" data-ref="C2">C2</button>, <button class="p" data-ref="D5">D5</button>, <button class="p" data-ref="R21">R21</button></h3>
<p>C2 (1 µF) is U6's required input capacitor, rated 50 V because hot-plugging can cause voltage spikes. D5 and R21 form the green "USB present" LED, wired straight to VBUS: (5.0 − 2.6) / 2k = 1.2 mA. On battery it takes essentially no current: VBUS is 0 V.</p>

<div data-tb="A friend's board works with an A-to-C cable but not C-to-C. Explain what's wrong and why."></div>
</template>

<template id="l6" data-t="The charger, U6" data-p="U6 R4 R5 R9 R10 R34 R7 R6 D1 C3 C4 R36">
<p class="goal">U6 is configured almost entirely by what its pins are wired to. Every pin is a decision.</p>
<div class="tw"><table><tr><th>Pin</th><th>Wired to</th><th>Effect</th></tr>
<tr><td>IN</td><td>VBUS, C2</td><td>Input. Recommended 4.35–6.4 V; protection trips near 6.6 V, and it survives up to 26 V with operation suspended</td></tr>
<tr><td>OUT</td><td>VSYS, C3</td><td>Output to the board, 4.4 V on USB</td></tr>
<tr><td>BAT</td><td>VBAT, C4</td><td>Battery; the datasheet asks for 4.7–47 µF here</td></tr>
<tr><td>CE</td><td>IO15 (CHG_DIS), <button class="p" data-ref="R36">R36</button> 100k to GND</td><td>Active low. R36 keeps charging on; IO15 high pauses it, and OUT still runs the board</td></tr>
<tr><td>EN2, EN1</td><td>GND, R4/R5 divider</td><td>EN2=0, EN1=1 selects USB500: input limited to 450–500 mA</td></tr>
<tr><td>ISET</td><td><button class="p" data-ref="R9">R9</button> 3.3k</td><td>Charge current: 890 / 3.3k = 270 mA</td></tr>
<tr><td>ILIM</td><td><button class="p" data-ref="R10">R10</button> 3.3k</td><td>Sets the limit only in EN2=1, EN1=0 mode (KILIM / R10, KILIM about 1550 A·Ω). Leaving it open disables all charging, so it must be fitted</td></tr>
<tr><td>TMR</td><td><button class="p" data-ref="R34">R34</button> 68k</td><td>Safety timer: 6.8–11.3 h fast charge, 41–68 min pre-charge</td></tr>
<tr><td>TD</td><td>GND</td><td>Termination stays enabled, so charging ends by itself</td></tr>
<tr><td>TS</td><td><button class="p" data-ref="TH1">TH1</button></td><td>Battery temperature (next lesson)</td></tr>
<tr><td>PGOOD</td><td><button class="p" data-ref="R7">R7</button> → IO1</td><td>Open-drain: low when USB is good</td></tr>
<tr><td>CHG</td><td><button class="p" data-ref="D1">D1</button>, <button class="p" data-ref="R6">R6</button></td><td>Open-drain: lights the red LED during the first charge after power-up; later top-up charges leave it off. Flashes at about 2 Hz for a fault</td></tr>
<tr><td>VSS, pad</td><td>GND</td><td>Ground and heat path</td></tr></table></div>
<h3>Why a divider on EN1?</h3>
<p>EN1 needs to be high only when USB is present, and <button class="p" data-ref="R4">R4</button>/<button class="p" data-ref="R5">R5</button> take it from VBUS. Include the chip's internal 285 kΩ pull-down and you get about 2.1 V, not 2.5 V. Work that out yourself: R5 in parallel with 285k, then the divider formula.</p>
<h2>How a lithium cell gets charged</h2>
<div class="dgw"><svg viewBox="0 0 640 210" role="img" aria-label="Charge stages">
<path class="wire" d="M50 180H630M50 180V14"/>
<path d="M50 166 L95 166 L95 40 L350 40 C 430 40 480 150 620 166" fill="none" stroke="var(--acc)" stroke-width="3" transform="translate(0,0)"/>
<path d="M50 150 L95 124 L350 30 L620 30" fill="none" stroke="var(--cu)" stroke-width="3"/>
<g font-size="12"><text x="60" y="198">Pre-charge</text><text x="190" y="198">Constant current</text><text x="420" y="198">Constant voltage</text>
<text x="360" y="22" fill="var(--cu)" style="fill:var(--cu)">voltage climbs to 4.2 V, then holds</text><text x="105" y="33" style="fill:var(--acc)">current: 27 mA, then 270 mA, then tapers</text></g>
<path d="M95 14V180M350 14V180" stroke="var(--line)" stroke-dasharray="3 4"/></svg></div>
<ol><li><b>Pre-charge:</b> below 3.0 V the cell gets a gentle 88 / 3.3k ≈ 27 mA.</li>
<li><b>Constant current:</b> a steady 270 mA as voltage rises.</li>
<li><b>Constant voltage:</b> held at 4.2 V, and current falls as the cell fills.</li>
<li><b>Done:</b> at 10% of the charge current (27 mA), charging stops. If the cell falls about 100 mV below 4.2 V, charging restarts.</li></ol>
<p>Time: 1200 mAh / 270 mA = 4.4 h, plus the slow final stage, so 5–6 h <span class="est">est.</span> The safety timer must outlast this, or a healthy charge would end in a false fault. That's why R34 is 68k.</p>
<h2>Why so slow? Heat</h2>
<p>U6 is a <b>linear</b> charger: it burns off the voltage difference rather than converting it. At 3.7 V: (5 − 3.7) × 0.27 A = <b>0.35 W</b> <span class="est">est.</span>. Double the current and you double the heat, on a small board that also carries a temperature sensor. If the chip reaches its 125 °C regulation limit, it reduces the charge current on its own.</p>
<div id="q6"></div>
<div data-tb="You want to charge at 500 mA. Work out the new R9 value and heat at 3.7 V, then say what else must change and what could go wrong."></div>
</template>

<template id="l7" data-t="Battery, safety, fuel gauge" data-p="J2 Q2 R11 TH1 R8 U5 R12 C5 TP4">
<p class="goal">The cell can deliver a lot of energy into a fault, so this block is about what could go wrong.</p>
<h3><button class="p" data-ref="J2">J2</button>: the connector</h3>
<p>Pin 2 is + and pin 1 is −. <b>Battery plug polarity isn't standardised</b>, so check every cell with a multimeter, because a cheap listing can arrive reversed.</p>
<h3><button class="p" data-ref="Q2">Q2</button>, <button class="p" data-ref="R11">R11</button>: reverse protection</h3>
<p>Q2 is an N-MOSFET in the battery's negative lead, so all cell current returns through it. Its gate connects to VBAT through 100 kΩ, and its source is GND.</p>
<ul><li><b>Correct cell:</b> VBAT is positive, so the gate is above the source and the FET turns on, acting almost like a wire.</li>
<li><b>Reversed cell:</b> the gate is below the source, so the FET stays off. Its built-in body diode points the blocking way too, so no loop forms.</li></ul>
<p>R11 carries almost no current, since a MOSFET gate draws essentially none. <b>Limit:</b> with USB in and a reversed cell, the charger slowly drains it through Q2, so check polarity before plugging in USB.</p>
<h3><button class="p" data-ref="TH1">TH1</button>: temperature</h3>
<p>Charging lithium when it's too cold or too hot damages the cell and can be dangerous. TH1 is an <button class="g" data-term="NTC">NTC</button>: its resistance falls as temperature rises. U6 pushes 75 µA through it and reads the voltage. It sits under the cell with a thermal pad; if that pad is missing, it mostly measures the board.</p>
<div class="box"><h3>Try it: TS window</h3><div id="w-ntc"></div></div>
<p><button class="p" data-ref="R8">R8</button> is an unfitted fixed 10k: a fallback that fakes 25 °C. It would defeat the protection, so it isn't fitted. The bias current flows only while VBUS is present, so TH1 doesn't drain the battery.</p>
<h3><button class="p" data-ref="U5">U5</button>: fuel gauge</h3>
<p>The MAX17048 estimates charge from voltage alone, using a cell model, without a current-sense resistor. It's connected directly to VBAT and has I2C address 0x36. <button class="p" data-ref="C5">C5</button> decouples it. QSTRT and CTG go to GND since they aren't used.</p>
<p>ALRT is open-drain, with <button class="p" data-ref="R12">R12</button> 100k up to +3V3, into IO0. While ALRT is held low: 3.3 V / 100k = <b>33 µA</b> wasted, and IO0 would also wake the chip immediately. So firmware must clear the alert before sleeping.</p>
<div class="note warn"><b>Safety.</b> Use a cell with a protection board. Never short, puncture or bend one. If it swells, stop using it. The case leaves room for swelling on purpose. Don't leave a first prototype charging unattended.</div>
<div id="q7"></div>
<div data-tb="Explain how Q2 protects against a reversed battery, drawing the current loop. Include what it doesn't protect against."></div>
</template>

<template id="l8" data-t="3.3 V regulator" data-p="U7 C6 C7 R13 C16 TP2 TP5">
<p class="goal">This small chip decides battery life and how low the battery can go.</p>
<h3><button class="p" data-ref="U7">U7</button>: how an LDO works</h3>
<p>Think of a variable resistor in series that a control loop adjusts to hold 3.3 V at the output. It can only reduce voltage, and the difference becomes heat:</p>
<div class="out">P = (VSYS − 3.3) × I<br>On USB, at 100 mA: (4.4 − 3.3) × 0.1 = 0.11 W<br>Efficiency = 3.3 / VIN: 75% at 4.4 V, 92% at 3.6 V</div>
<h3>Why an LDO, not a switching regulator?</h3>
<p>A switching regulator can be more efficient at high current, but this board sleeps most of the time, so standby current matters most. U7 uses about <b>2 µA</b>. An LDO is also quiet and has few parts. The catch is wasted heat during Wi-Fi.</p>
<h3>Dropout</h3>
<p>The minimum headroom between input and output. The datasheet gives 0.31 V at 600 mA for this voltage. Roughly scaled, a 350 mA <span class="est">est.</span> Wi-Fi burst needs about 0.18 V, so the battery has to stay above about 3.5 V for a clean 3.3 V.</p>
<h3><button class="p" data-ref="C6">C6</button>, <button class="p" data-ref="C7">C7</button>, <button class="p" data-ref="C16">C16</button>: stability</h3>
<p>LDOs are feedback loops and can oscillate without the right output capacitor. The datasheet needs 1 µF effective. C7 sits right at the output, on the regulator's side of R13, so it stays connected while R13 is removed. C6 is at the input, and C16 is 10 µF bulk on +3V3.</p>
<h3><button class="p" data-ref="R13">R13</button>: the measurement link</h3>
<p>This 0 Ω link is the only feed from <code>LDO_OUT</code> to <code>+3V3</code>. Remove it, connect an ammeter across its pads, and you can measure the real sleep current of everything on 3.3 V. This matters most for your embedded work: it shows whether firmware really sleeps. Start on the meter's mA range and use µA only once the chip is asleep: a wake-up burst through a µA range can sag +3V3 and reset the chip, or blow the meter's fuse.</p>
<p>EN on U7 connects to VSYS, so the LDO is on whenever there's power. <b>The board has no off switch.</b> "Off" just means asleep, which is why every microamp counts. U5, U6 and U7 alone take roughly 10–30 µA from the cell. A 1200 mAh cell at 20 µA would last about 7 years on paper; self-discharge would run it down first. At 200 µA, it's about 8 months.</p>
<div class="note warn"><b>Don't feed 3.3 V from a programmer with no battery fitted.</b> The RT9080's absolute maximum lets VOUT sit only 0.3 V above VIN, and with no battery VIN has no supply. That's why J4's pin 1 is a sense-only line through 1 kΩ.</div>
<div id="q8"></div>
<div data-tb="Explain why this design chose an LDO, and what would make you change to a switching regulator."></div>
</template>

<template id="l9" data-t="ESP32-C6 module" data-p="U1 C8 C9 C10 R15 R16 R24 R27 J4">
<p class="goal">You know this chip from the software side. Here's what the hardware has to give it.</p>
<h3><button class="p" data-ref="U1">U1</button> is a module, not a bare chip</h3>
<p>Inside its metal can are the ESP32-C6, 4 MB flash, crystal and RF matching network, all RF-tested and certified by Espressif. Without the module, you'd have to design all of that. You only supply power, reset and a clear area around the antenna.</p>
<h3>Power: <button class="p" data-ref="C8">C8</button> and <button class="p" data-ref="C9">C9</button></h3>
<p>C8 (22 µF) covers large Wi-Fi bursts, while C9 (100 nF) covers fast edges. Espressif asks for a supply that can provide at least 500 mA. U7 is rated for 600 mA.</p>
<h3>Reset: <button class="p" data-ref="R15">R15</button> and <button class="p" data-ref="C10">C10</button></h3>
<p>EN must stay low until power is stable. The RC delays it: 10 kΩ × 1 µF = <b>10 ms</b>. EN is only reachable on the pogo pads, so there's no reset button in the case.</p>
<h3>Strapping pins: hardware read at reset</h3>
<p>Like a config register the chip reads once at boot:</p>
<div class="tw"><table><tr><th>Pin</th><th>Here</th><th>Why</th></tr>
<tr><td>IO9</td><td><button class="p" data-ref="R24">R24</button> 10k up, and the DN button</td><td>High: normal boot. Low with IO8 high at reset: ROM download mode</td></tr>
<tr><td>IO8</td><td><button class="p" data-ref="R16">R16</button> 10k up, and red LED cathode side</td><td>Must be high for download mode; also keeps red off</td></tr>
<tr><td>IO15</td><td>CHG_DIS, <button class="p" data-ref="R36">R36</button> 100k down</td><td>Only matters if the JTAG eFuse is burned. It resets as an input with no pull, so R36 holds charging on</td></tr></table></div>
<p>The DN button's filter cap is on IO9. 10k × 100 nF = 1 ms, well inside the 10 ms reset delay, so IO9 has settled before the chip samples it.</p>
<div class="note"><b>Your recovery path.</b> If firmware breaks USB: unplug USB and battery, hold DN, plug USB in. The chip starts in the ROM bootloader and you can flash it.</div>
<h3>The GPIO map</h3>
<div class="tw"><table><tr><th>IO</th><th>Net</th><th>Why that pin</th></tr>
<tr><td>0</td><td>BAT_ALRT_N</td><td rowspan="6">LP pins can wake deep sleep through ext1. The LP pins are IO0–7, and IO6–7 are the I2C bus, so wake sources use IO0–5</td></tr>
<tr><td>1</td><td>USB_PGOOD_N</td></tr><tr><td>2</td><td>BTN_N (UP)</td></tr><tr><td>3</td><td>ACC_INT1</td></tr><tr><td>4</td><td>BARO_INT</td></tr><tr><td>5</td><td>BTN2_N (OK)</td></tr>
<tr><td>6, 7</td><td>I2C SDA, SCL</td><td>LP pins, so the low-power core can use I2C</td></tr>
<tr><td>8, 14, 15</td><td>LED R, B, G</td><td>Active low</td></tr>
<tr><td>9</td><td>BTN3_N (DN)</td><td>Strap pin, polled, can't wake</td></tr>
<tr><td>12, 13</td><td>USB D−, D+</td><td>Fixed USB pins</td></tr>
<tr><td>18–23</td><td>BUSY, RST, DC, CS, SCK, MOSI</td><td>E-paper</td></tr>
<tr><td>RXD0, TXD0</td><td>To J4</td><td>Backup UART</td></tr></table></div>
<h3>Antenna</h3>
<p>The antenna is part of the module's PCB and overhangs the top edge by 5.4 mm, with no copper under it, as Espressif recommends. Copper nearby detunes it, as can metal or the battery. <b>That overhang makes a real difference to Wi-Fi range.</b> Keep the case free of metal there.</p>
<h3><button class="p" data-ref="J4">J4</button>, <button class="p" data-ref="R27">R27</button></h3>
<p>Pogo pads for recovery: VREF, GND, EN, IO9, TXD0, RXD0. VREF comes from +3V3 through R27 1k, letting a programmer sense voltage but not power the board.</p>
<div id="q9"></div>
<div data-tb="Walk through what happens electrically from plugging in USB to your first line of firmware, naming R15, C10, R24 and R16."></div>
</template>

<template id="l10" data-t="I2C and sensors" data-p="U2 U3 U4 U5 R17 R18 C11 C12 C13 C14 C15 R35">
<p class="goal">You've written I2C drivers. This is the analog side of the same bus.</p>
<p><button class="p" data-ref="R17">R17</button> and <button class="p" data-ref="R18">R18</button> (10 kΩ) pull SDA and SCL high. Devices only pull low, so the bus rises at a speed set by the pull-up and the wiring's capacitance. That's the rounded edge you see on a scope.</p>
<div class="box"><h3>Try it: pull-up trade-off</h3><div id="w-i2c"></div></div>
<p><b>The rule from this:</b> run the bus at 100 kHz, and never leave a line held low in sleep. That would waste 330 µA per line, which dwarfs the sleep current. Also, if firmware has enabled U5's sleep mode, holding both SDA and SCL low for about 2 s puts it to sleep.</p>
<h2>The four devices</h2>
<div class="tw"><table><tr><th>Part</th><th>Measures</th><th>Addr</th><th>Set by</th><th>Notes</th></tr>
<tr><td><button class="p" data-ref="U2">U2</button> SHT40</td><td>Temp, humidity</td><td>0x44</td><td>Fixed by part variant (AD1B)</td><td>On the isolated island, with C11</td></tr>
<tr><td><button class="p" data-ref="U3">U3</button> BMP580</td><td>Pressure</td><td>0x46</td><td>SDO to GND</td><td>CSB to +3V3 selects I2C; C12, C13</td></tr>
<tr><td><button class="p" data-ref="U4">U4</button> LIS2DW12</td><td>Motion</td><td>0x19</td><td>SA0 to +3V3</td><td>CS to +3V3 selects I2C; INT1 on IO3; C14, C15</td></tr>
<tr><td><button class="p" data-ref="U5">U5</button> MAX17048</td><td>Battery</td><td>0x36</td><td>Fixed</td><td>Powered from VBAT</td></tr></table></div>
<p>Bosch and ST sensors can speak I2C or SPI, and the pin level picks which. That's why CSB and CS are wired high.</p>
<h2>Interrupts and polarity</h2>
<p>ext1 wakes on one common level, and buttons and open-drain alerts are active low. U4's INT1 defaults to active-high push-pull, so firmware must set <code>H_LACTIVE</code>. U3's INT defaults to active low, open-drain and disabled, so <button class="p" data-ref="R35">R35</button> 100k pulls <code>BARO_INT</code> high. Keep it open-drain and set <code>int_en</code> = 1 before arming sleep. This is hardware and firmware fitting together.</p>
<h2>Why U2 is on an island</h2>
<p>A temperature sensor measures itself, and copper conducts heat from warmer parts. So U2 sits on a tab cut away from the board by a milled slot, joined only by four thin 0.15 mm traces with no copper pour. Humidity also depends on temperature, so 1 °C of board heat also skews %RH. Don't trust readings while charging.</p>
<div id="q10"></div>
<div data-tb="An I2C scan finds 0x19, 0x36 and 0x46 but not 0x44. List your suspects in order, and how you'd test each."></div>
</template>

<template id="l11" data-t="Buttons and LEDs" data-p="SW1 SW2 SW3 R14 R28 C27 R29 R30 C28 R31 C29 D1 D5 D6 R6 R21 R22 R32">
<p class="goal">The simplest circuits on the board, and a great way to practise RC thinking.</p>
<h2>The button circuit</h2>
<p>Each button, like UP: <code>+3V3 → R14 100k → BTN_N → R28 100R → SW1 → GND</code>, with <button class="p" data-ref="C27">C27</button> 100 nF on BTN_N, feeding IO2.</p>
<ul><li><b>Idle:</b> R14 holds the line high. No current flows, so sleep costs nothing.</li>
<li><b>Press:</b> C27 discharges through R28: τ = 100 Ω × 100 nF = 10 µs, nearly instant.</li>
<li><b>Release:</b> C27 recharges through R14: τ = 100 kΩ × 100 nF = 10 ms. This hides contact bounce.</li>
<li><b>R28</b> also limits ESD current and caps the discharge peak.</li></ul>
<div class="box"><h3>Try it: RC recharge</h3><div id="w-rc"></div></div>
<p>SW3 (DN) differs: its pull-up is <button class="p" data-ref="R24">R24</button> 10k, since IO9 needs a stronger strap. Its τ is therefore 1 ms.</p>
<h2>The LEDs</h2>
<div class="tw"><table><tr><th>LED</th><th>Circuit</th><th>Current</th><th>Lit when</th></tr>
<tr><td><button class="p" data-ref="D5">D5</button> PWR green</td><td>VBUS → R21 2k → LED → GND</td><td>(5.0 − 2.6)/2k = 1.2 mA</td><td>USB is present</td></tr>
<tr><td><button class="p" data-ref="D1">D1</button> CHG red</td><td>VSYS → R6 2k → LED → U6 CHG</td><td>(4.4 − 1.8)/2k = 1.3 mA</td><td>U6 pulls CHG low</td></tr>
<tr><td><button class="p" data-ref="D6">D6</button> red</td><td>+3V3 → LED → R32 1k → IO8</td><td>(3.3 − 1.8)/1k = 1.5 mA</td><td>IO8 low</td></tr>
<tr><td>D6 blue</td><td>+3V3 → LED → R22 470R → IO14</td><td>(3.3 − 2.6)/470 = 1.5 mA</td><td>IO14 low</td></tr></table></div>
<p>The LED voltages are approximate, read at low current. D6 is <b>common anode</b>: red and blue share +3V3 (green is unused: IO15 went to the charger's CE), so a GPIO turns one on by sinking current, which means active low. An LED at this current is dim but visible, and 1.5 mA is still about 75 times a 20 µA sleep target <span class="est">est.</span>, so turn them off in firmware.</p>
<div id="q11"></div>
<div data-tb="Why does the UP button use both R14 (100k) and R28 (100R)? Explain what would happen with no R28, and what would happen if a 100 Ω replaced R14."></div>
</template>

<template id="l12" data-t="E-paper and the boost" data-p="J3 L1 Q1 D2 D3 D4 R19 R20 C17 C18 C19 C20 C21 C22 C23 C24 C25 C26 R25 R26">
<p class="goal">The hardest analog on your board: how 3.3 V becomes tens of volts, both positive and negative.</p>
<p>E-paper moves charged pigments with an electric field, so an image stays with no power. But moving them needs high voltages of both polarities, up to about ±20 V. The SSD1681 datasheet lists gate drive VGH of +10 to +20 V, a matching negative VGL, and source drive up to +17 V and −17 V. The SSD1681 controller on the panel handles most of it, but needs a few parts on your board. Those parts are copied from the panel maker's reference circuit.</p>
<h2>Step through the boost</h2>
<div class="box"><div id="w-boost"></div></div>
<h3>The key idea</h3>
<p>Inductor current can't change instantly. Turn off the switch and the inductor forces its current onward, pushing the node as high as needed until something conducts. While charging, Q1 holds SW near GND, so L1 sees the full 3.3 V. From V = L × di/dt, current rises at 3.3 V / 47 µH ≈ 70 mA per µs.</p>
<h2>Each part's job</h2>
<div class="tw"><table><tr><th>Part</th><th>Job</th></tr>
<tr><td><button class="p" data-ref="L1">L1</button> 47 µH</td><td>Energy store, rated above the current it will see (saturation 0.95 A)</td></tr>
<tr><td><button class="p" data-ref="Q1">Q1</button></td><td>The switch, driven by GDR from the panel controller</td></tr>
<tr><td><button class="p" data-ref="R19">R19</button> 1 MΩ</td><td>Holds Q1's gate low when nothing's driving it, so it can't float on</td></tr>
<tr><td><button class="p" data-ref="R20">R20</button> 2.2 Ω</td><td>Current sense on RESE: V = I × 2.2 Ω tells the controller when to stop</td></tr>
<tr><td><button class="p" data-ref="D2">D2</button>, <button class="p" data-ref="C18">C18</button></td><td>Catches the high peak: positive rail PREVGH</td></tr>
<tr><td><button class="p" data-ref="C19">C19</button>, <button class="p" data-ref="D3">D3</button>, <button class="p" data-ref="D4">D4</button>, <button class="p" data-ref="C20">C20</button></td><td><button class="g" data-term="Charge pump">Charge pump</button> that flips swings into a negative rail, PREVGL</td></tr>
<tr><td><button class="p" data-ref="C21">C21</button>, <button class="p" data-ref="C24">C24</button>, <button class="p" data-ref="C25">C25</button>, <button class="p" data-ref="C26">C26</button></td><td>Hold VSH2, VSH1, VSL, VCOM, the regulated drive rails</td></tr>
<tr><td><button class="p" data-ref="C23">C23</button></td><td>Controller's internal core supply VDD</td></tr>
<tr><td><button class="p" data-ref="C22">C22</button></td><td>Decouples the panel's VCI/VDDIO on +3V3</td></tr>
<tr><td><button class="p" data-ref="C17">C17</button></td><td>4.7 µF reserve for the boost input</td></tr></table></div>
<p>The diodes are Schottky types, which have a low voltage drop and switch off quickly. High-voltage caps are rated 50 V, and the layout has a special 0.2 mm clearance rule on these nets.</p>
<h2>The digital side, which you know</h2>
<p>4-wire SPI, chosen by BS tied to GND. It's write-only: there is no MISO, and the panel signals completion through BUSY on IO18.</p>
<div class="tw"><table><tr><th>IO</th><th>Signal</th><th>Sleep behaviour</th></tr>
<tr><td>18</td><td>BUSY</td><td>Input</td></tr><tr><td>19</td><td>RST_N</td><td><button class="p" data-ref="R25">R25</button> 100k holds it high</td></tr>
<tr><td>21</td><td>CS_N</td><td><button class="p" data-ref="R26">R26</button> 100k holds it high (deselected)</td></tr>
<tr><td>20, 22, 23</td><td>DC, SCK, MOSI</td><td>Use gpio_hold so the inputs don't float</td></tr></table></div>
<p>Why this matters: floating CMOS inputs can sit mid-rail and draw extra current in sleep.</p>
<h3><button class="p" data-ref="J3">J3</button>: the connector</h3>
<p>A 24-pin 0.5 mm connector with contacts on both sides. The panel's tail wraps around the board edge, which flips it over. A wrong connector type would mirror the pin order, so that detail matters. You still need to test it with the real panel.</p>
<div id="q12"></div>

</template>

<template id="l13" data-t="Layout: why copper matters" data-p="U6 U7 U1 U2 J1 TH1">
<p class="goal">The same schematic can succeed or fail depending on layout. This is the part LLMs struggle with most, so review it yourself.</p>
<h2>Your stack, 4 layers</h2>
<div class="tw"><table><tr><th>Layer</th><th>Contents</th></tr>
<tr><td>F.Cu (front)</td><td>All parts, about half the signals, GND pour</td></tr>
<tr><td>In1.Cu</td><td>Solid GND</td></tr>
<tr><td>In2.Cu</td><td>+3V3 pour and some GND</td></tr>
<tr><td>B.Cu (back)</td><td>GND pour, about half the signals (including USB and I2C), J4 pads; the display sits here</td></tr></table></div>
<p>The 281 <button class="g" data-term="Via">vias</button> link these layers.</p>
<h2>Return current</h2>
<p>Remember that current flows in loops. At high speed, return current takes the path of lowest <b>impedance</b>: right underneath its signal trace, in the nearest plane. That keeps the loop small. A small loop radiates less and picks up less noise. So <b>don't cut the plane under a fast signal</b>, because the return has to detour, the loop grows and you get an antenna you didn't want. That's why In1 stays solid.</p>
<h2>Decoupling placement</h2>
<p>A cap is only useful through a short path. A trace has inductance, which resists the fast current the cap exists to provide. So: cap by the pin, ground via right beside it.</p>
<h2>Heat</h2>
<p>Copper is the board's radiator. <button class="p" data-ref="U6">U6</button>'s pad has 5 vias to carry heat to inner copper, and <button class="p" data-ref="U7">U7</button>'s ground is solid-connected for the same reason. The price of heat is that <button class="p" data-ref="U2">U2</button>'s island and <button class="p" data-ref="TH1">TH1</button> can both be affected, and this is still unmeasured.</p>
<h2>Trace width and vias</h2>
<p>Width sets resistance and heat. Power traces are wider and multiple vias share current. The thin traces on the sensor bridge are deliberate, as they conduct less heat, and sensors draw so little that their resistance doesn't matter.</p>
<h2>Physical design</h2>
<ul><li><b>Keep-outs:</b> no copper below the antenna.</li>
<li><b>Panel:</b> 5 mm rails on left and right only, since parts overhang the top and bottom. Cut the tabs rather than bending them, so nearby parts and tracks don't crack.</li>
<li><b>ENIG finish:</b> flat gold pads for the tiny leadless parts.</li></ul>
<h2>Checks, and what they miss</h2>
<div class="tw"><table><tr><th>Check</th><th>Catches</th><th>Misses</th></tr>
<tr><td>ERC</td><td>Unconnected pins, conflicting outputs</td><td>A valid but wrong circuit</td></tr>
<tr><td>DRC</td><td>Shorts, spacing, manufacturing limits, schematic mismatch</td><td>Poor return paths, heat, noise</td></tr>
<tr><td><code>tools/check_net.py</code></td><td>Connections differing from intended</td><td>A wrong intention</td></tr>
<tr><td>Real board</td><td>Everything</td><td>Nothing, but it's costly</td></tr></table></div>
<div class="box"><h3>Exercise: your real copper</h3><div id="w-cu"></div><ol><li>Step through the four layers. Which ones are nearly solid copper?</li><li>Highlight <code>USB_D+</code>. Which layers does it use?</li><li>Highlight <code>VSYS</code> and follow it from U6 to U7.</li><li>Find the SHT40 moat, the white cut-out at the top edge. Which four wires cross its bridge?</li></ol><details><summary>Show the answers</summary><p class="ans">1. Inner 1 is a ground plane, and Inner 2 is mostly +3.3 V and ground pours. 2. Top and Bottom, changing layer at 4 vias. 3. VSYS stays on Top, with no vias. 4. SDA, GND, SCL and +3V3, each a 0.15 mm track on Top.</p></details></div>
<div id="q13"></div>

<template id="l14" data-t="Bring-up: first power" data-p="TP1 TP2 TP3 TP4 TP5 R13">
<p class="goal">This is where understanding stops being theory. Predict first, then measure.</p>
<p>Bring up one block at a time, and don't move on until the current one behaves. You only need a multimeter to start. A USB power meter that shows current is a cheap, useful extra.</p>
<h2>The order</h2>
<ol><li><b>Inspect.</b> Compare with the assembly drawing. Check D1, D5 and D6 and the IC pin-1 marks.</li>
<li><b>Before any power,</b> with no USB and no cell, measure resistance from VBUS, VSYS, VBAT and +3V3 to GND. Allow about 10 s per reading: low and climbing is just the capacitors charging. Stop only if it stays under a few ohms.</li>
<li><b>USB, no battery.</b> Check the USB rows of the sheet below. Don't test Wi-Fi yet.</li>
<li><b>Flash a blink.</b> Use red and blue.</li>
<li><b>I2C scan.</b> Expect 0x19, 0x44, 0x46. 0x36 (U5) runs from VBAT, so it may not answer until the cell is fitted.</li>
<li><b>Buttons.</b> Read each, and test wake.</li>
<li><b>Battery.</b> Check polarity with a meter first, then charge while you stay nearby.</li>
<li><b>Display.</b> Fit the panel, and test a full refresh.</li>
<li><b>Sleep current.</b> Replace R13 with an ammeter: mA range first, µA only once asleep.</li>
<li><b>Heat.</b> Measure U6 and the cell with a thermocouple during a full charge.</li></ol>
<div class="box"><h3>Your prediction sheet</h3><p class="small">Fill in your prediction <b>before</b> revealing mine. When boards arrive, add measurements. It saves in this browser.</p><div id="w-sheet"></div></div>
<h2>Fault → first suspect</h2>
<div class="tw"><table><tr><th>Symptom</th><th>Look at</th></tr>
<tr><td>Dead on C-to-C, fine on A-to-C</td><td>R1, R2, CC soldering</td></tr>
<tr><td>Green off, VBUS 0 V</td><td>Cable, J1 soldering</td></tr>
<tr><td>VBUS good, VSYS 0 V</td><td>U6, its soldering, or a short on VSYS</td></tr>
<tr><td>VSYS good, +3V3 0 V</td><td>U7, R13, or a short on +3V3</td></tr>
<tr><td>Not on USB, no serial port</td><td>D+/D− path, EN, IO9 held low</td></tr>
<tr><td>Red LED flashing at 2 Hz</td><td>Timer fault; replug USB and look at the cell</td></tr>
<tr><td>Red never on after replugging USB, cell not full</td><td>Cell connection, D1, R6, and IO15 (CHG_DIS) left high. After a full charge it stays off by design. A TH1 pause keeps red lit with no charge current</td></tr>
<tr><td>Boards differ, same fault not on both</td><td>Assembly, not design</td></tr>

const Q={
1:[["A GPIO reads 3.3 V relative to GND. Which statement is right?",["It has 3.3 V stored in it","It sits 3.3 V above the reference point","It always supplies 3.3 mA","Voltage flows out of it"],1,"Voltage is a difference between two points. How much current flows depends on what's connected."],
["D1 runs from 4.4 V through 2 kΩ, with Vf about 1.8 V. What's its current?",["0.9 mA","1.3 mA","2.2 mA","13 mA"],1,"(4.4 − 1.8) / 2000 = 1.3 mA. The resistor only sees the voltage left over after the LED."],
["Doubling current through a fixed resistor changes its heat by:",["No change", "×2", "×4", "×½"],2,"V doubles and I doubles, so P = V × I goes up ×4. Lesson 6 differs: a linear charger's voltage drop stays fixed, so its heat only doubles."]],
2:[["A 100 nF cap beside a chip's power pin is mostly for:",["Filtering I2C","Supplying fast current bursts locally","Setting clock speed","Storing data"],1,"It's a tiny local energy reserve. The current's too fast to arrive through long traces."],
["R14 is 100k and C27 is 100 nF. What's τ?",["10 µs","1 ms","10 ms","100 ms"],2,"100,000 × 0.0000001 = 0.01 s."],
["Open-drain output, let go, with no pull-up. The line:",["Goes high","Goes low","Floats undefined","Oscillates"],2,"Open-drain can only pull low. Something else must supply the high."]],
3:[["Two pins in different corners both labelled VSYS are:",["Unrelated","Connected","Connected only if a wire is drawn","An error"],1,"A label makes them the same net."],
["For worst-case design, you use:",["Typical","Absolute max","Min and max","The first page"],2,"Typical is what you usually get. Your design must work across the range."],
["Absolute maximum ratings mean:",["Safe to run there","Exceeding them may cause damage","Typical conditions","Power limits only"],1,"Use the recommended operating conditions for normal running."],
["R8 is marked DNP. On the assembled board:",["It's 10k","It's 0 Ω","There's an empty footprint","It's a fuse"],2,"Do not populate: the pads exist with no part."]],
4:[["USB in, battery fitted. VSYS is about:",["3.3 V","VBAT","4.4 V","5 V"],2,"U6 regulates OUT to 4.4 V on USB."],
["USB out. +3V3 on a 3.1 V battery, asleep, is about:",["3.3 V","3.1 V","4.4 V","0 V"],1,"The LDO can't step up, so at tiny loads its output follows its input."],
["USB in, 350 mA system load, charger set to 270 mA. Charging current becomes about:",["270 mA","150 mA","500 mA","0 mA"],1,"Input limit about 500 mA minus 350 mA for the load, or a little less at the low end of the limit's 450–500 mA range. System load has priority."],
["How does firmware know USB is in?",["Reads VBUS by ADC","USB_PGOOD_N low on IO1","Reads +3V3","It can't"],1,"U6's open-drain PGOOD pulls IO1 low."]],
5:[["Removing R1 and R2 most likely causes:",["USB data fails, power stays", "No 5 V from a C-to-C charger", "The battery gets damaged", "Nothing changes"],1,"Sources wait to see 5.1k on CC before turning on VBUS."],
["U8 protects mainly against:",["Reversed battery","Static discharge on data lines","Overcharging","Wi-Fi noise"],1,"It steers fast spikes to rails."],
["The green LED is on. That proves:",["3.3 V is good","VBUS has power","Firmware runs","Battery charging"],1,"D5 hangs directly off VBUS. It says nothing about the rest."]],
6:[["You change R9 to 6.8k. Charge current becomes about:",["130 mA","270 mA","550 mA","890 mA"],0,"890 / 6800 ≈ 131 mA. Larger resistor, less current."],
["ILIM is unused in USB500 mode. Can you remove R10?",["Yes, it saves a part", "No, open ILIM disables charging", "Only with a battery fitted", "Only on USB-C chargers"],1,"It's right in the pin table. Read warnings like this."],
["Charging from 5 V at 3.7 V, 270 mA. U6's heat is about:",["0.1 W","0.35 W","1.0 W","1.35 W"],1,"(5 − 3.7) × 0.27 = 0.35 W."],
["Red LED flashes at 2 Hz. Most likely:",["Normal charging","Charge complete","Safety timer fault","Low firmware"],2,"The datasheet: CHG flashes about 2 Hz on a fault."]],
7:[["A reversed cell is fitted, USB unplugged. Q2 is:",["On, shorting it","Off, blocking current","Burning out","Irrelevant"],1,"Gate is below source, and body diode blocks too."],
["TH1 reads 55 °C during charging. U6:",["Speeds up", "Pauses charging", "Ignores it", "Disconnects USB"],1,"The hot limit is about 47 °C nominal, at most 51 °C with tolerances. It resumes below about 44.7 °C."],
["BAT_ALRT_N stays low during deep sleep. Effect:",["Nothing at all", "Wastes 33 µA and can wake the chip", "It damages U5", "The battery starts charging"],1,"3.3 V / 100k = 33 µA, and active-low wake fires immediately."]],
8:[["U7 at 4.4 V in, 200 mA out. Its heat is about:",["0.22 W","0.66 W","0.88 W","1.1 W"],0,"(4.4 − 3.3) × 0.2 = 0.22 W."],
["R13 is removed with no ammeter. What happens?",["Nothing","+3V3 loses power","VSYS loses power","USB stops charging"],1,"It's the only link from LDO_OUT to +3V3."],
["Average 200 µA, 1200 mAh. Runtime is about:",["25 days","8 months","7 years","70 years"],1,"1200 / 0.2 = 6000 h ≈ 250 days."]],
9:[["C10 changes to 10 µF, R15 unchanged. EN delay is:",["1 ms","10 ms","100 ms","Unchanged"],2,"10k × 10 µF = 100 ms. Startup is slower but it still works."],
["You hold DN at power-up. Why does the chip enter download mode?",["USB command","IO9 is low when straps are sampled","Firmware detects it","Battery logic"],1,"Strap pins are latched at reset."],
["Why is the accelerometer interrupt on IO3 rather than IO18?",["IO18 is unreliable", "Only LP pins can wake deep sleep", "IO3 reads faster", "Any pin would work"],1,"The LP pins are IO0–7. Pin choice comes from the sleep architecture."],
["Why overhang the antenna past the board edge?",["Looks better","Copper nearby detunes it","Saves copper","Easier soldering"],1,"Espressif recommends it: no ground below the antenna."]],
10:[["Sleep firmware leaves SDA low with 10k pull-up. Extra current?",["3.3 µA","33 µA","330 µA","3.3 mA"],2,"3.3 V / 10k = 330 µA."],
["Why is the bus at 100 kHz, not 400 kHz?",["Sensors can't do 400 kHz", "10k pull-ups rise too slowly for it", "An ESP32 I2C limit", "It saves flash"],1,"tr ≈ 0.85RC. With about 50 pF, that's about 420 ns, past the 300 ns limit."],
["CSB on U3 is tied to +3V3 because:",["Chip power","It selects I2C mode","It sets the address","Reset"],1,"Pulling CSB low would select SPI."],
["Why the slot around U2?",["Strength","It blocks heat conducted through the board","Antenna","Humidity leaks"],1,"Temperature sensors read their own temperature."]],
11:[["Why does SW1 have its own 100 Ω?",["Sets brightness","Limits current spikes and ESD into IO2","Sets wake time","Pull-up"],1,"Press would otherwise short C27 directly."],
["D6 blue is on when IO14 is:",["High","Low","Floating","Any"],1,"Common anode on +3V3, GPIO sinks."],
["D5 draws how much on battery?",["0 mA","1.2 mA","1.5 mA","20 mA"],0,"It's powered only from VBUS, which is 0 V on battery."]],
12:[["The boost switch has just opened. The inductor:",["Stops current instantly","Forces current onward, raising the node","Stores more energy","Shorts to GND"],1,"Inductor current can't change instantly."],
["R19 exists because:",["Limits current","A floating gate could turn Q1 on","Adds gain","Filters SPI"],1,"A gate is a tiny capacitor, so without a defined level it can drift."],
["How is the negative rail produced?",["By reversing the battery", "C19 with D3 and D4", "A separate regulator chip", "The LDO U7"],1,"Charge pump: D3 charges C19, then D4 transfers it below ground."],
["With no MISO, you know refresh has ended by:",["Timer only","BUSY on IO18","Reading a register","USB"],1,"The panel signals through BUSY."]],
13:[["At high speed, return current mostly flows:",["Shortest path through any layer","Right beneath the signal trace","Through the battery","Along the board edge"],1,"Lowest impedance means smallest loop."],
["DRC passes with 0 errors. That proves:",["Board works","Files match rules you set","Wi-Fi range","Heat is fine"],1,"It's a rule check, not a circuit test."],
["Why are the SHT40 bridge traces thin?",["Saves copper","Less heat conduction","Higher speed","Manufacturing limit"],1,"And the sensor's tiny current doesn't need width."]],
14:[["Resistance from +3V3 to GND stays near 0 Ω after 10 s, before power. You:",["Plug in USB and watch", "Stop and find the short", "Fit the battery to test it", "Reflash the firmware"],1,"Measuring first protects the rest."],
["USB in: TP1 5 V, TP2 4.4 V, TP5 0 V. First suspects?",["The USB cable", "U7, R13, or a short on +3V3", "The battery", "The SHT40"],1,"Follow the chain: the last good point is VSYS."],
["Both boards have the same fault. That suggests:",["Solder defect","Design mistake","Bad luck","Cable"],1,"Assembly defects are random; design faults repeat."]],
15:[["USB in. D5 lit, TP2 4.4 V, TP5 3.3 V, no serial port. You hold DN and replug, and still nothing. Best next check?",["BMP580 wiring on the I2C bus", "The D+/D− path and EN", "Battery connection at J2", "R9's charge-current value"],1,"Power is good, so follow data and reset: D+/D− at U8 and IO12/IO13, then EN."],
["I2C scan finds nothing at all, while the chip runs fine. First suspect?",["One sensor's solder joints", "Something all the devices share", "Battery sagging under load", "The Wi-Fi antenna match"],1,"A whole-bus failure points to what's common: R17, R18, or a line held low."],
["Sleep current reads 350 µA, and you expected about 20 µA. Your first guess is:",["A faulty LDO drawing too much", "A line held low through a 10k pull-up", "A cell losing charge by itself", "Wi-Fi still transmitting in sleep"],1,"3.3 V / 10k = 330 µA is suspiciously close. Numbers point to causes."],
["Battery won't charge in a cold garage. USB is fine. Likely:",["A failed charger chip U6", "The cold limit working as designed", "R9 drifting in the cold", "A bad USB cable"],1,"The TS cold limit is about 3.5 °C. That's correct behaviour, not a fault."],
["Charging suddenly pauses during hot weather, then resumes. Likely:",["TH1 reaching its hot limit", "A firmware bug", "The safety timer expiring", "The USB cable overheating"],0,"Board heat may reach TH1 in a warm room. It's an unmeasured risk."],
["Wi-Fi resets the board at 3.45 V on battery, but not on USB. Likely:",["A detuned antenna", "Cell sag plus LDO dropout on +3V3", "I2C noise from the radio", "A wrong Wi-Fi password"],1,"The cell sags under the burst while dropout grows, and USB avoids both. Firmware should block Wi-Fi below about 3.55 V."],
["You swap R9 to 1k for faster charging. What's wrong?",["Nothing: it just charges faster", "890 mA exceeds the input limit and adds heat", "Only the safety timer changes", "The red LED stops working"],1,"The input limit caps it, the cell would see far above its gentle rate, and heat multiplies. Think through the whole system."],
["Panel shows nothing, BUSY stuck high. Boost node isn't switching. First check?",["The SHT40 on the I2C bus", "J3 seating, then Q1 and L1", "Battery plug polarity", "The USB data lines"],1,"Start with the connector, then the boost parts: Q1, L1, R19, R20."]]

const GLOSS={"Vf": "Forward voltage: what a diode or LED drops while conducting. Roughly fixed: about 0.6–0.7 V for silicon, 0.3–0.5 V for Schottky, 1.8 V for a red LED. It rises only slightly with current.", "Boost converter": "A switching circuit that makes a voltage higher than its input, using an inductor, a switch and a diode.", "Charge pump": "Uses a capacitor and diodes to shift a voltage, here to make a negative rail from a switching node.", "CC / CV": "Constant current, then constant voltage: the two main stages of charging a lithium cell.", "CC (USB-C)": "Configuration Channel: pins a USB-C source checks for a 5.1k pull-down before sending 5 V.", "Body diode": "A diode built into a MOSFET, conducting from source to drain even when the FET is off.", "Gate, source, drain": "The three terminals of a MOSFET. Gate voltage relative to source controls current between drain and source.", "Linear": "A regulator or charger that burns the excess voltage as heat rather than converting it.", "Schottky": "A diode with a low voltage drop that switches off quickly.", "Decoupling cap": "A small capacitor beside a chip's power pin that supplies fast current bursts locally.", "Deep sleep": "ESP32 mode where most of the chip is off. Only certain pins or a timer can wake it.", "Differential pair": "Two traces carrying opposite signals. The receiver reads the difference, so shared noise cancels.", "DNP": "Do not populate: the footprint exists but no part is fitted.", "DPPM": "Dynamic power-path management: the charger reduces charge current so the system load gets what it needs.", "DRC": "Design rule check: compares the layout against spacing, manufacturing and connection rules.", "Dropout": "The minimum voltage an LDO needs between input and output. Below it, the output follows the input down.", "ENIG": "A flat gold PCB finish, suited to tiny leadless chips.", "ERC": "Electrical rule check: finds schematic problems like unconnected pins or conflicting outputs.", "ESD": "Electrostatic discharge: a very fast, high-voltage spike, such as from a finger.", "FPC": "Flexible printed circuit: the thin ribbon tail on the display.", "GND": "The shared reference point that voltages are measured from, and the usual return path for current.", "LDO": "Low-dropout linear regulator: holds a fixed output by turning the excess voltage into heat.", "Net": "A set of pins wired together, all at the same voltage (ignoring trace resistance).", "NTC": "A resistor whose resistance falls as temperature rises. Used as a temperature sensor.", "Open-drain": "An output that can only pull low or let go. A pull-up supplies the high level.", "Plane / pour": "A large area of copper on a layer, usually ground or power.", "Power path": "A charger design that feeds the system and charges the battery as separate paths.", "Pull-up": "A resistor that holds a line high when nothing is pulling it low.", "Quiescent current": "What a chip draws just for being on, with no load. U7's is about 2 µA.", "Rail": "A power net that many parts share, such as VSYS or +3V3.", "Return current": "The current flowing back to the source. It completes the loop, usually through ground.", "Strap pin": "A pin the chip reads once at reset to choose a boot setting.", "τ (tau)": "R × C: the time an RC circuit takes to cover 63% of a change.", "Via": "A small plated hole that connects copper layers.", "Vf": "Forward voltage: the nearly fixed voltage across a conducting diode or LED."};
const MA={"1": "The LED holds a nearly fixed voltage, about 1.8 V for red. With nothing else in the loop, the remaining 1.5 V has almost no resistance to limit it, so current climbs until the LED burns out. A resistor takes up that leftover voltage and sets the current: I = (3.3 − 1.8) / R.", "2": "A pull-up gives the line a default high when nothing pulls it low. A smaller resistor charges the line's capacitance faster (τ = R × C), so edges are quicker. But whenever the line is held low, I = V / R flows: 330 µA with 10k at 3.3 V, 33 µA with 100k.", "3": "Tap the part to see which chip pin it connects to. Read that pin's entry and formula in the datasheet, then calculate using min and max. Compare with the part's value. R9 is a good example: ISET pin, KISET / R, 241–295 mA.", "4": "With USB in: J1, VBUS, U6 IN, U6 OUT (VSYS, about 4.4 V), U7, LDO_OUT, R13, +3V3, then U1. When unplugged, U6 connects the battery to VSYS, so VSYS sits just under VBAT and U7 carries on. PGOOD lets go, R7 pulls IO1 high, and firmware can read that or wake on it.", "5": "A USB-C charger keeps VBUS off until it sees a 5.1k pull-down on CC. An A-to-C cable's 5 V is always on, so it works without those resistors. Suspect R1 or R2 missing or badly soldered, or one resistor shared across both CC pins.", "6": "R9 = 890 / 0.5 = 1.78k, so about 1.8k gives about 494 mA. Heat at 3.7 V: (5 − 3.7) × 0.5 = 0.65 W, nearly double. USB500 limits total input to 450–500 mA, so the load would eat into charging. For more, set EN2 high and EN1 low, and choose R10 for the limit you want. Also check the cell's allowed charge rate, the TH1 hot limit, and the board's temperature.", "7": "The loop is: cell +, J2 pin 2, VBAT, the circuit, GND, Q2 source to drain, J2 pin 1, cell −. Correct cell: the gate is above the source, so Q2 turns on. Reversed: the gate is below the source, so Q2 stays off, and its body diode blocks as well. It doesn't protect against a slow drain with USB in. Nor does it replace the cell's protection board for shorts and over-discharge.", "8": "The board sleeps most of the time, so standby current matters most. U7 needs only about 2 µA, is quiet, and needs few parts. The costs are heat, efficiency of 3.3 / VIN, and charge left unused once the cell gets low. A switcher makes sense if the board stays awake at high current, or if you need to use the last of the cell.", "9": "USB power reaches U6, then VSYS, then U7, and +3V3 rises. R15 charges C10, holding EN low for about 10–15 ms while power settles. R24 and R16 have pulled IO9 and IO8 high. When EN rises, the chip latches the straps, sees IO9 high, and boots from flash into your firmware.", "10": "The bus works, since the other three answer, so suspect what only U2 has. First, inspect U2's soldering, because it's tiny. Next, check for 3.3 V across C11 on the island. Then check SDA and SCL continuity across the 0.15 mm bridge traces. Finally compare with your second board, and confirm the part variant is the 0x44 one.", "11": "100k alone: every press shorts C27 straight through the switch, giving a sharp current spike and no series protection against ESD into IO2. With only 100 Ω between +3V3 and the switch: pressing connects 3.3 V to GND through 100 Ω, wasting 33 mA, and release is too fast to hide bounce. Together, the 100k sets the idle level and slow release, while the 100R limits the spike.", "12": "An inductor resists any sudden change in its current, so when the switch opens it keeps pushing current onward. The node rises above the supply until the diode conducts into a capacitor, and repeating this pumps that capacitor up to a high voltage.", "13": "At high speed, return current wants to flow directly under its signal trace. A slot forces it to detour, which makes the loop bigger, so it radiates more, picks up more noise and adds inductance. DC doesn't care where it flows, so a continuity test still passes and the fault stays hidden.", "14": "Look first: inspect parts and polarity. Measure resistance to GND on each rail, since catching a short is free. Apply USB and check VBUS, VSYS, then +3V3, in that order, stopping at the first wrong one. Then flash a blink, and scan I2C. Do the cheapest and safest checks first, and only one new thing at a time.", "15": "There's no single right answer. A strong write-up follows the power path, then boot, then each bus, and gives a reason for each design choice with a number behind it. Use the checklist above to find what you left out."};
