[workspace]
resolver = "2"
members = ["logic", "ui", "render"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
embedded-graphics = "0.8"
heapless = "0.8"
png = "0.18"
u8g2-fonts = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
std_instead_of_core = "warn"
